name: bidscube_sdk_flutter
description: "BidsCube Flutter SDK for displaying image, video, and native ads across all platforms."
version: 0.1.0
homepage: https://github.com/bidscube/bidscube-sdk-flutter

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.4.2
  video_player: ^2.8.1
  http: ^1.1.0
  xml: ^6.3.0
  package_info_plus: ^4.2.0
  device_info_plus: ^9.1.0
  interactive_media_ads: ^0.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.bidscube.sdk
        pluginClass: BidscubeSdkPlugin
      ios:
        pluginClass: BidscubeSdkPlugin
