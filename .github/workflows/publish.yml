name: Publish to pub.dev and Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart SDK 3.10.3
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.3'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: "stable"

      - name: Verify Flutter and Dart versions (debug)
        run: |
          echo "Flutter:"; flutter --version
          echo "Dart:"; dart --version || true
          # Show machine JSON to extract frameworkVersion
          if command -v jq >/dev/null 2>&1; then
            flutter --version --machine | jq -r '.frameworkVersion as $fv | .dartSdkVersion as $dv | "Framework: "+$fv+"  Dart: "+$dv'
          else
            flutter --version --machine
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Verify package
        run: flutter pub publish --dry-run

  # Replaced the broken reusable-workflow usage with an inline publish job
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Required when pub.dev package admin enables "Require GitHub Actions environment".
    # Name must match exactly what you set on pub.dev (Dart docs recommend `pub.dev`).
    # Create it: GitHub repo → Settings → Environments → New environment → `pub.dev`
    environment: pub.dev
    permissions:
      contents: read
      id-token: write
    outputs:
      result: ${{ steps.publish-result.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart SDK 3.10.3
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.3'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: "stable"

      - name: Install dependencies
        run: flutter pub get

      - name: Publish to pub.dev (treat "already exists" as success)
        id: publish-result
        shell: bash
        run: |
          set -euo pipefail
          echo "Running dart pub publish -f"
          output=$(dart pub publish -f 2>&1) || rc=$?
          # Ensure rc has a value
          rc=${rc:-0}
          echo "--- publish output ---"
          echo "$output"
          echo "--- end output ---"
          if [ "$rc" -ne 0 ]; then
            if echo "$output" | grep -qi "already exists"; then
              echo "Detected existing version on pub.dev — continuing"
              echo "result=already_exists" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Publish failed with exit code $rc"
              echo "result=failed" >> $GITHUB_OUTPUT
              exit $rc
            fi
          fi
          echo "result=published" >> $GITHUB_OUTPUT

  create_release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOYMENT_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed
            
            This release includes the latest version of the BidsCube Flutter SDK.
            
            ### Installation
            ```yaml
            dependencies:
              bidscube_sdk_flutter: ^${{ github.ref_name }}
            ```
            
            ### Documentation
            - [pub.dev package](https://pub.dev/packages/bidscube_sdk_flutter)
            - [GitHub repository](https://github.com/bidscube/bidscube-sdk-flutter)
            
            ### Changelog
            Please refer to the [CHANGELOG.md](https://github.com/bidscube/bidscube-sdk-flutter/blob/main/CHANGELOG.md) for detailed changes.
          draft: false
          prerelease: false
