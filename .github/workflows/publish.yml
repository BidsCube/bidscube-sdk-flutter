name: Publish to pub.dev and Create Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Dart SDK 3.10.3
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.3'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.4"
          channel: "stable"

      - name: Verify Flutter and Dart versions (debug)
        run: |
          echo "Flutter:"; flutter --version
          echo "Dart:"; dart --version || true
          # Show machine JSON to extract frameworkVersion
          if command -v jq >/dev/null 2>&1; then
            flutter --version --machine | jq -r '.frameworkVersion as $fv | .dartSdkVersion as $dv | "Framework: "+$fv+"  Dart: "+$dv'
          else
            flutter --version --machine
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Verify package
        run: flutter pub publish --dry-run

  publish:
    needs: build
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      environment: Au9x8cT9G0ycd7q70azxp

  create_release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: actions/create-release@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: |
            ## What's Changed

            This release includes the latest version of the BidsCube Flutter SDK.

            ### Installation
            ```yaml
            dependencies:
              bidscube_sdk_flutter: ^${{ github.ref_name }}
            ```

            ### Documentation
            - [pub.dev package](https://pub.dev/packages/bidscube_sdk_flutter)
            - [GitHub repository](https://github.com/bidscube/bidscube-sdk-flutter)

            ### Changelog
            Please refer to the [CHANGELOG.md](https://github.com/bidscube/bidscube-sdk-flutter/blob/main/CHANGELOG.md) for detailed changes.
          draft: false
          prerelease: false
